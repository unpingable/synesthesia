name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust 1.85.1
        run: |
          rustup toolchain install 1.85 --profile minimal --component rustfmt,clippy
          rustup default 1.85
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Build release binaries
        run: cargo build --locked --release --features ebpf --bins
