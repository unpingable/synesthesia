name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust 1.85.1
        run: |
          rustup toolchain install 1.85 --profile minimal --component rustfmt,clippy
          rustup default 1.85
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Diagnose generated release tools
        run: |
          cargo build --locked --release --features ebpf --bins
          ./target/release/synesthesia doctor --format json | jq .
          ./target/release/synesthesia completions bash > /tmp/synesthesia.bash
          ./target/release/synesthesia manpage > /tmp/synesthesia.1
          test -s /tmp/synesthesia.bash
          grep -q '^\.TH' /tmp/synesthesia.1
      - name: Package release
        run: ./scripts/build-release.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            target/dist/*.tar.gz \
            target/dist/*.sha256 \
            --verify-tag \
            --title "Synesthesia $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
