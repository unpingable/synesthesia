[package]
name = "synesthesia"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Data in. Terminal weather out."
license = "Apache-2.0"
repository = ""

[[bin]]
name = "synesthesia"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
strip = true
