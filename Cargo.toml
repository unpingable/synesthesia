[package]
name = "synesthesia"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["James Beck"]
description = "Terminal-native visual weather for live machine activity."
license = "Apache-2.0"
repository = "https://github.com/unpingable/synesthesia"
readme = "README.md"
keywords = ["terminal", "visualization", "tui", "networking", "ascii-art"]
categories = ["command-line-utilities", "visualization"]
publish = false
default-run = "synesthesia"

[[bin]]
name = "synesthesia"
path = "src/main.rs"

[[bin]]
name = "synesthesia-scheduler-collector"
path = "src/bin/synesthesia-scheduler-collector.rs"
required-features = ["ebpf"]

[[bin]]
name = "synesthesia-tcp-collector"
path = "src/bin/synesthesia-tcp-collector.rs"
required-features = ["ebpf"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
crossterm = "0.28"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "=0.13.1", optional = true, default-features = false }

[features]
default = []
ebpf = ["dep:aya"]
ebpf-live = ["ebpf"]

[profile.release]
lto = "thin"
strip = true
